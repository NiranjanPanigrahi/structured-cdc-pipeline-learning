services:
  mysql:
    image: mysql:8.0
    container_name: cdc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: cdc_demo
      MYSQL_USER: cdcuser
      MYSQL_PASSWORD: cdcpass123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
